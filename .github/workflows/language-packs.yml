name: Check language packs
on:
  push:
    paths: ['JPX-PLUS*.user.js', 'plugins/config-store/i18n.json', 'scripts/check-language-packs.cjs', '.github/workflows/language-packs.yml']
  pull_request:
    paths: ['JPX-PLUS*.user.js', 'plugins/config-store/i18n.json', 'scripts/check-language-packs.cjs', '.github/workflows/language-packs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/check-language-packs.cjs
