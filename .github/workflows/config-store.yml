name: Check configuration store
on:
  push:
    paths: ['JPX-PLUS*.user.js', 'plugins/config-store/**', 'scripts/build-config-store.cjs', '.github/workflows/config-store.yml']
  pull_request:
    paths: ['JPX-PLUS*.user.js', 'plugins/config-store/**', 'scripts/build-config-store.cjs', '.github/workflows/config-store.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check JPX-PLUS.user.js
      - run: node --check JPX-PLUS-ConfigStore.user.js
      - run: node scripts/build-config-store.cjs --check
      - run: node plugins/config-store/service.test.cjs
