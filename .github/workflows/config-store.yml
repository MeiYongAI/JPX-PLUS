name: Check configuration management
on:
  push:
    paths: ['JPX-PLUS*.user.js', 'src/config-manager/**', 'scripts/build-config-*.cjs', 'scripts/check-preview.cjs', 'docs/**', 'tests/**', 'package*.json', '.github/workflows/config-store.yml']
  pull_request:
    paths: ['JPX-PLUS*.user.js', 'src/config-manager/**', 'scripts/build-config-*.cjs', 'scripts/check-preview.cjs', 'docs/**', 'tests/**', 'package*.json', '.github/workflows/config-store.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run check:docs
