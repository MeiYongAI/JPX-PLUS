<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HV Utils</title><link rel="stylesheet" href="popup.css"></head><body>
<main id="home" aria-label="HV Utils">
  <nav><a id="version" href="https://github.com/MeiYongAI/JPX-PLUS" target="_blank" rel="noopener" title="打开 GitHub 仓库"></a><button id="settings" type="button">设置</button></nav>
  <div class="illustration"><img src="toolbox.svg" width="80" height="80" alt="HV Utils"></div>
  <dl><dt>最新版本：</dt><dd id="latest">—</dd><dt>上次检查：</dt><dd id="checked">—</dd><dt>更新检查：</dt><dd id="status" role="status">读取中…</dd></dl>
  <button class="action" id="check" type="button">检查更新</button><a class="action" id="download" target="_blank" rel="noopener" hidden>下载新版 ZIP</a>
</main>
<main id="preferences" aria-labelledby="title" hidden>
  <nav><button id="back" type="button">← 返回</button><h1 id="title">设置</h1></nav>
  <label for="interval">自动检查更新间隔</label><select id="interval" disabled><option value="1">每小时</option><option value="6">每 6 小时</option><option value="12" selected>每 12 小时</option><option value="24">每天</option><option value="0">关闭自动检查</option></select>
  <p>修改后自动保存。定时检查新版本，发现新版时提示。</p><p id="saved" role="status"></p>
</main><script src="popup.js"></script></body></html>
